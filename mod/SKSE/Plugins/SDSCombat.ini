; SDS Combat - one SKSE plugin for the SDS combat runtime
; (replaces SDSNPCTargetLock.dll and SDSMotionDebug.dll - remove both)
; The log is Documents\My Games\Skyrim Special Edition\SKSE\SDSCombat.log

[General]
bEnabled = 1

; ---------------------------------------------------------------------------------------------------
; NPC target lock driven by animation annotations. NPCs have no target lock by default.
;   SDS_NPC_TargetLockOn     lock onto the player at full force
;   SDS_NPC_TargetLockOff    no lock (beats TargetLockOn in the same clip)
;   SDS_NPC_StopRotation     no rotation at all (beats both)
;   SDS_NPC_TargetLockReset  forget everything the clip set so far, the annotations can be fired again
;   SDS_NPC_TargetLockOn.<0..1>  the same with a strength: 1 = full force, 0 = no turning at all (the AI's own
;                                turning is switched off too), between = that share of fMaxEngineTurnSpeed
;                                (0.5 = 120 deg/s with the default 240)
;   SDS_NPC_TurnSpeed.<0..1>     change the strength later in the same clip (also turns the lock on)
;   SDS_NPC_BumpOff / SDS_NPC_BumpOn   the NPC passes its target instead of sticking on its collision (see [Bump])
;   SDS_NPC_ReachTarget.ref|min|max|arrive   scale the attack's forward root motion so it ends `arrive` units from the
;                                target (see [ReachTarget]); SDS_NPC_ReachTargetEnd stops it (so does the end of the clip)
; Every flag ends when the clip that fired it ends (or is played again).
; Full description with examples: SDS DLL\research\SDSCombat_Annotations_RU.md

[TargetLock]
; turn speed toward the target, degrees per second; 0 = full force (faces the target every frame)
fTurnSpeed = 0
; 0 = the player, only while the player is this NPC's combat target
; 1 = the player, always
; 2 = whoever this NPC is fighting
iTarget = 0
; do not lock beyond this distance (game units); 0 = no limit
fMaxDistance = 0
; how the lock turns the NPC:
; 1 = through the AI turn speed, like the engine itself turns (root motion follows the new heading)
; 0 = SetHeading every frame (old way: the root motion stays in a stale frame and the NPC slides sideways)
; with 1, if the AI turn speed is not set for an NPC during a lock, it falls back to 0 for that lock (warning in the log)
iMethod = 1
; iMethod = 1 with fTurnSpeed = 0: the fastest turn, degrees per second (the engine itself turns NPCs at most ~230)
fMaxEngineTurnSpeed = 240
; while the lock is on, a root-motion step that goes sideways is turned to go straight ahead (same length), toward the
; target. While an NPC turns, the engine sometimes applies attack root motion turned by up to ~100 deg (seen with both
; AMR and Root Motion Revolution); this removes that drift - and also the animation's own sideways motion while locked.
bStraightRootMotion = 1
; steps more than this many degrees off ahead (stepping back) are left as they are; the engine error reaches ~125 deg,
; while the boss attacks with lock annotations have almost no authored motion beyond 150 deg
fStraightMaxAngle = 150

[AnimMotion]
; Root motion that follows the animation, as Elden Ring applies its root-motion track: every frame the direction of the
; NPC's step is taken from the animmotion annotations of the clip playing, relative to where the NPC faces now (the
; engine's own direction goes 20-125 deg wrong while an NPC turns; the length of its step is right and is kept).
; Works without the lock and keeps the animation's own sideways steps under the lock (bStraightRootMotion is then only
; the fallback for clips the catalog does not know).
; The catalog is built once per game start, in the background, from every Data\meshes\...\animations\...\*.hkx with
; animmotion: an "animmotion catalog" line in the log. The clips are recognised by their animation data (the names
; cannot be read at runtime). Skipped: Reactive Dodge Framework clips (animations\RDF\, RDF_Motion) and NPCs while
; RDF_IsDodging is set, and animations whose data two files share with different paths.
bEnabled = 1
; annotated motion per frame (game units) below which the engine's step is left as it is
fMinStep = 0.05

[Bump]
; SDS_NPC_BumpOff (also written SDS_NPCBumpOff) ... SDS_NPC_BumpOn: in between, the engine's attack movement magnetism
; is off for that NPC through Animation Motion Fix (graph variable AMF_bForbidMoveMagnetism): it does not stop dead on
; the player's collision and runs on past it, and AMF keeps it from shoving the player. The end of the clip also ends it.
; Needs Animation Motion Fix with DisableNpcMovementMagnetism = false, and the variable in the NPC's graph (BFCO adds it
; to the humanoid graph; a creature without it gets one warning in the log).
bEnabled = 1

[ReachTarget]
; SDS_NPC_ReachTarget.ref|min|max|arrive (game units, 1 m ~ 70): when the annotation fires, the distance D to the target
; is measured once and the forward root motion until SDS_NPC_ReachTargetEnd is multiplied by
;   k = clamp(D - arrive, min, max) / ref
; ref = how far the animation moves in that window. ref / min / max are animmotion distances and are multiplied by
; the NPC's scale (a boss at 1.65 covers 1.65 times its annotated path); arrive is a world distance.
; These clamp k whatever the payload says:
fMinScale = 0
fMaxScale = 2

[StopRotation]
; force the AI turn speed to 0
bZeroAIRotation = 1
; pin the heading to the value it had when StopRotation fired (also blocks the clip's own root yaw)
bHoldHeading = 1

[Compatibility]
; also read MagnetismStartTCB / MagnetismStopTCB (Trigger Combat Behaviour). Off: the SDS clips use SDS_NPC_*.
; Turning it on also needs those two events added back to SDSCombat_BDI.json.
bLegacyTCB = 0

[Log]
; every SDS_NPC_* annotation an NPC receives, with the clip that sent it
bLogAnnotations = 0
; every change of what the lock does to an NPC: LOCK ON / released / LOCK OFF / ROTATION STOPPED, why a requested lock
; did not engage, and when a lock or stop ends, how far the NPC was off (before / after correction, upper body)
bLogTransitions = 0

; ---------------------------------------------------------------------------------------------------
; Debug drawing, done by this plugin in its own layer over TrueHUD (TrueHUD's own debug lines do not show in SDS).
; Everything below is off for normal play: the log then gets only a few lines at start-up, and nothing is written per
; frame. To debug: [Log] bLogTransitions / bLogAnnotations = 1 (what the lock does, which clips are recognised, reach
; values), [LockDebug] bEnabled + bCombat = 1 (arrows), [Debug] bMovementCsv = 1 (per-frame CSV, grows ~1 MB a minute).

[Debug]
; every 5 seconds: how often each hook fired ("[diag]" lines in the log)
bDiagnostics = 0
; a magenta cross over the player's head every frame: if you do not see it, the drawing itself does not work
bTestDraw = 0
; if Character::Update never fires, update the NPCs from the HUD frame instead (logged once when it kicks in)
bFallbackDriver = 1
; every frame of every watched NPC (position, heading, NPC Root, direction to the player, displacement, attacking,
; bAnimationDriven, bAllowRotation) and all its graph events, to SDSCombat_movement.csv next to the log
bMovementCsv = 0

[LockDebug]
; while a lock or StopRotation is active (and, with bCombat, any time an NPC fights the player), every frame:
;   green arrow   - where the lock wants the NPC to look (toward the target)
;   red arrow     - the heading StopRotation holds (instead of green)
;   yellow arrow  - the NPC's heading (what the engine uses)
;   blue arrow    - where the NPC really faces (the NPC Root bone, includes the animation's own root rotation)
;   magenta line  - to the lock target
;   white arrow   - at the feet: where the NPC actually moved this frame (as a velocity, 0.3 s of travel)
; when a lock / stop ends, a "...movement" line in the log gives the distance moved, its forward / sideways split
; and the average angle between the real displacement and the heading, the heading at the start, NPC Root and the target
bEnabled = 0
; also watch NPCs fighting the player when no SDS_NPC_* flag is set (green = toward the player); logged as
; "in combat, engine turning", with the same "...movement" summary when it changes to a lock / stop and back
bCombat = 0
fArrowLength = 110
fThickness = 3
bDrawBody = 1

[MotionDebug]
; attack root motion against the AMR animmotion annotations, from the start of each clip:
;   green  - where the NPC really went
;   yellow - the annotated motion turned by the heading at clip start (+ animrotation)
;   cyan   - the annotated motion turned by the NPC's heading (angle.z) of each frame
;   blue   - the annotated motion turned by where the NPC Root bone faces each frame
;   orange - the annotated motion turned toward the target each frame (what it should have been)
;   arrows - cyan: NPC heading, blue: NPC Root, magenta: direction to the target
;   white cross = clip start, green cross = clip end
; one "[motion]" summary line per clip goes to the log, with the deviation of the real path from each model
; and which model it followed ("closest")
; Off: on the SDS bosses the clips' annotation data cannot be read at runtime (the reads fault), so this draws nothing;
; [LockDebug] bCombat + the movement CSV measure the real motion instead.
bEnabled = 0
bOnlyFightingPlayer = 1
fMaxDistance = 4000
bDraw = 1
fPersistSeconds = 6
fThickness = 2
fZOffset = 4
bDrawActual = 1
bDrawClipFrame = 1
bDrawCurrentFrame = 1
bDrawRootFrame = 1
bDrawIdeal = 1
bDrawArrows = 1
; which way an animrotation angle turns the clip frame (+1 / -1), unverified
fAnimRotationSign = 1
; per-frame rows to SDSCombat_motion.csv
bCsv = 0

[MotionFix]
; EXPERIMENTAL, off by default. Measured on the SDS bosses with Root Motion Revolution: while an NPC turns during an
; attack, its root motion follows heading + animation, until at some point it snaps to (turn since the clip started)
; and stays there until a later step of the animation - the NPC slides sideways.
; This watches the real motion for that snap and turns the displacement back (moves the NPC with SetPosition).
; It cannot see the animation's own direction, so it catches only part of it (on the recorded fights: 5-25% less
; sideways drift under the lock). "motion fix ON / ended" lines in the log, SDS_motionfix_* rows in the CSV.
bEnabled = 0
; turns smaller than this (degrees) since the clip started are not checked
fMinTurn = 15
; how close the snap must be to the turn (degrees; 12% of the turn when that is larger)
fTolerance = 8
; slower motion (game units per frame) is not checked
fMinStep = 0.8
